name: Operational checks
on:
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: read
jobs:
  maintenance:
    if: github.event_name != 'deployment_status' && vars.OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run reservation cleanup and notification worker
        env:
          APP_URL: ${{ vars.OPERATIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --max-time 55 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/internal/maintenance"
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/smoke-production.mjs
        env:
          SMOKE_URL: ${{ github.event.deployment_status.environment_url || vars.OPERATIONS_URL }}
          SMOKE_SLUG: ${{ vars.SMOKE_SLUG }}
